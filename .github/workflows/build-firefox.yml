# 关键路径：你的仓库被克隆到 ../firefox-sky1-repo/
DEBIAN_SOURCE_DIR="../firefox-sky1-repo/debian"

echo "=== Debug: Checking source directory ==="
ls -la "$DEBIAN_SOURCE_DIR" || { echo "ERROR: debian source not found!"; exit 1; }
echo "=== Debug: Checking patches directory ==="
ls -la "$DEBIAN_SOURCE_DIR/patches" || { echo "ERROR: patches directory not found!"; exit 1; }

# 复制完整的 debian 文件夹到当前 Firefox 源码目录
cp -r "$DEBIAN_SOURCE_DIR" .

# 获取系统架构
ARCH=$(uname -m)
echo "Detected architecture: $ARCH"

# 进入补丁目录，使用仓库中已有的 series 文件
cd debian/patches

# 验证 series 文件存在
if [ ! -f "series" ]; then
  echo "ERROR: series file not found in patches directory!"
  exit 1
fi

# 针对 ARM64 架构过滤不兼容的补丁
if [[ "$ARCH" == "aarch64" ]] || [[ "$ARCH" == "arm64" ]]; then
  echo "ARM64 detected: Removing incompatible patches..."
  # 使用 sed -i 直接修改 series 文件
  sed -i '/i386/d' series
  sed -i '/ppc64el/d' series
  sed -i '/armel/d' series
  echo "Filtered series file for ARM64:"
else
  echo "Non-ARM64 architecture: Applying all patches."
fi

# 显示最终的 series 文件内容用于调试
echo "Final series file content:"
cat series
echo ""

# 修复：列出 debian-hacks 子目录下的补丁文件
echo "Available patch files:"
ls -la debian-hacks/*.patch 2>/dev/null || echo "No patch files found in debian-hacks/"

# 回到源码根目录并应用补丁
cd ../..
echo "Applying patches with quilt..."
quilt push -a || {
  echo "Failed to apply patches. Checking quilt status..."
  quilt push -v
  exit 1
}
echo "All patches applied successfully."
