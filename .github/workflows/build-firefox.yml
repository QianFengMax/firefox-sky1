name: Build Firefox with V4L2-M2M Patches

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout firefox-sky1 repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper dpkg-dev quilt meson ninja-build \
            libva-dev libdrm-dev \
            autoconf2.13 unzip zip \
            libgtk-3-dev libglib2.0-dev \
            libpulse-dev libasound2-dev \
            libx11-xcb-dev libxtst-dev \
            python3 python3-distutils \
            cargo rustc \
            yasm libvpx-dev \
            wget

      - name: Get Firefox source code from Mozilla official
        run: |
          # 设置 Firefox ESR 版本，你可以根据需要修改
          FIREFOX_VERSION="140.14.0esr"
          DOWNLOAD_URL="https://ftp.mozilla.org/pub/firefox/releases/${FIREFOX_VERSION}/source/firefox-${FIREFOX_VERSION}.source.tar.xz"
          
          echo "Downloading Firefox ESR source from: $DOWNLOAD_URL"
          wget -O firefox-source.tar.xz "$DOWNLOAD_URL"
          
          if [ $? -ne 0 ]; then
            echo "Error: Failed to download Firefox ESR source code."
            echo "Please check if the version ${FIREFOX_VERSION} exists at https://ftp.mozilla.org/pub/firefox/releases/"
            exit 1
          fi
          
          tar -xf firefox-source.tar.xz
          
          FIREFOX_SRC_DIR=$(find . -maxdepth 1 -type d -name "firefox-*" | head -n 1)
          if [ -z "$FIREFOX_SRC_DIR" ]; then
            echo "Error: Cannot find the extracted Firefox source directory."
            exit 1
          fi
          echo "FIREFOX_SRC_DIR=${FIREFOX_SRC_DIR}" >> $GITHUB_ENV
          echo "Firefox source directory: ${FIREFOX_SRC_DIR}"

      - name: Apply V4L2-M2M patches
        run: |
          cd "${{ env.FIREFOX_SRC_DIR }}"
          cp -r ../debian .
          quilt push -a

      - name: Build Debian package
        run: |
          cd "${{ env.FIREFOX_SRC_DIR }}"
          dpkg-buildpackage -us -uc -b

      - name: Upload built .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: firefox-v4l2-debs
          path: ./*.deb
